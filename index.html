<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Mom ✨</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// ============================================================
// SCENE
// ============================================================

const scene = new THREE.Scene();


// ============================================================
// CAMERA
// ============================================================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.z = 9;


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setClearColor(0x000000);

document.body.appendChild(
    renderer.domElement
);


// ============================================================
// GLOW TEXTURE
// ============================================================

function createGlowTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 128;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createRadialGradient(
            64,
            64,
            0,
            64,
            64,
            64
        );

    gradient.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        0.15,
        "rgba(255,255,255,1)"
    );

    gradient.addColorStop(
        0.35,
        "rgba(255,180,220,0.8)"
    );

    gradient.addColorStop(
        0.6,
        "rgba(255,80,180,0.25)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        128,
        128
    );

    return new THREE.CanvasTexture(
        canvas
    );
}

const glowTexture =
    createGlowTexture();


// ============================================================
// TEXT CANVAS
// ============================================================

const textCanvas =
    document.createElement("canvas");

textCanvas.width = 2200;
textCanvas.height = 600;

const ctx =
    textCanvas.getContext("2d");

ctx.clearRect(
    0,
    0,
    textCanvas.width,
    textCanvas.height
);


// ============================================================
// TEXT STYLE
// ============================================================

ctx.textAlign = "center";
ctx.textBaseline = "middle";


// ============================================================
// LINE 1
// ============================================================

ctx.font =
    "bold 150px Arial";

ctx.fillStyle =
    "white";

ctx.fillText(
    "Chúc mừng sinh nhật mẹ thơ!!",
    textCanvas.width / 2,
    210
);


// ============================================================
// LINE 2
// ============================================================

ctx.font =
    "bold 75px Arial";

ctx.fillText(
    "Chúc mẹ luôn vui vẻ, mạnh khỏe, xinh đẹp và hạnh phúc nhé! ❤️",
    textCanvas.width / 2,
    390
);


// ============================================================
// GET PIXELS
// ============================================================

const imageData =
    ctx.getImageData(
        0,
        0,
        textCanvas.width,
        textCanvas.height
    );

const pixels =
    imageData.data;


// ============================================================
// PARTICLE ARRAYS
// ============================================================

const positions = [];
const colors = [];
const sizes = [];


// ============================================================
// TEXT → PARTICLES
// ============================================================

const particleGap = 5;

for (
    let y = 0;
    y < textCanvas.height;
    y += particleGap
) {

    for (
        let x = 0;
        x < textCanvas.width;
        x += particleGap
    ) {

        const index =
            (y * textCanvas.width + x) * 4;

        const alpha =
            pixels[index + 3];

        if (alpha > 100) {

            // --------------------------------------------
            // ANGLE AROUND THE 3D RING
            // --------------------------------------------

            const angle =
                ((x / textCanvas.width) -
                0.5)
                * Math.PI * 2;


            // --------------------------------------------
            // RING RADIUS
            // --------------------------------------------

            const radius =
                3.4 +
                (Math.random() - 0.5)
                * 0.12;


            // --------------------------------------------
            // 3D POSITION
            // --------------------------------------------

            const px =
                Math.cos(angle) *
                radius;

            const pz =
                Math.sin(angle) *
                radius;


            const py =
                -(y -
                textCanvas.height / 2)
                / 150;


            positions.push(
                px,
                py,
                pz
            );


            // --------------------------------------------
            // PINK / PURPLE / GOLD COLORS
            // --------------------------------------------

            const hue =
                0.88 +
                Math.random() * 0.18;

            const color =
                new THREE.Color();

            color.setHSL(
                hue % 1,
                1,
                0.68
            );


            colors.push(
                color.r,
                color.g,
                color.b
            );


            // --------------------------------------------
            // PARTICLE SIZE
            // --------------------------------------------

            sizes.push(
                0.045 +
                Math.random() * 0.075
            );
        }
    }
}


// ============================================================
// TEXT GEOMETRY
// ============================================================

const textGeometry =
    new THREE.BufferGeometry();

textGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        positions,
        3
    )
);

textGeometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(
        colors,
        3
    )
);

textGeometry.setAttribute(
    "size",
    new THREE.Float32BufferAttribute(
        sizes,
        1
    )
);


// ============================================================
// TEXT MATERIAL
// ============================================================

const textMaterial =
    new THREE.PointsMaterial({

        size: 0.095,

        map: glowTexture,

        transparent: true,

        opacity: 1,

        vertexColors: true,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });


// ============================================================
// TEXT PARTICLES
// ============================================================

const textParticles =
    new THREE.Points(
        textGeometry,
        textMaterial
    );

scene.add(
    textParticles
);


// ============================================================
// EXTRA SPARKLES
// ============================================================

const sparkleCount = 3500;

const sparklePositions = [];
const sparkleColors = [];

for (
    let i = 0;
    i < sparkleCount;
    i++
) {

    const angle =
        Math.random() *
        Math.PI * 2;

    const radius =
        2.5 +
        Math.random() * 2.2;

    const y =
        (Math.random() - 0.5)
        * 4;


    sparklePositions.push(

        Math.cos(angle) *
        radius,

        y,

        Math.sin(angle) *
        radius

    );


    const color =
        new THREE.Color();

    color.setHSL(
        0.85 +
        Math.random() * 0.15,
        1,
        0.7
    );

    sparkleColors.push(
        color.r,
        color.g,
        color.b
    );
}


// ============================================================
// SPARKLE GEOMETRY
// ============================================================

const sparkleGeometry =
    new THREE.BufferGeometry();

sparkleGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        sparklePositions,
        3
    )
);

sparkleGeometry.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(
        sparkleColors,
        3
    )
);


// ============================================================
// SPARKLE MATERIAL
// ============================================================

const sparkleMaterial =
    new THREE.PointsMaterial({

        size: 0.055,

        map: glowTexture,

        transparent: true,

        opacity: 0.75,

        vertexColors: true,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });


// ============================================================
// SPARKLES
// ============================================================

const sparkles =
    new THREE.Points(
        sparkleGeometry,
        sparkleMaterial
    );

scene.add(
    sparkles
);


// ============================================================
// ENERGY RINGS
// ============================================================

function createEnergyRing(
    radius,
    color,
    opacity
) {

    const points = [];

    const segments = 500;

    for (
        let i = 0;
        i < segments;
        i++
    ) {

        const angle =
            (i / segments)
            * Math.PI * 2;

        points.push(
            new THREE.Vector3(
                Math.cos(angle) *
                radius,

                0,

                Math.sin(angle) *
                radius
            )
        );
    }


    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(points);


    const material =
        new THREE.LineBasicMaterial({

            color: color,

            transparent: true,

            opacity: opacity,

            blending:
                THREE.AdditiveBlending
        });


    return new THREE.LineLoop(
        geometry,
        material
    );
}


const ring1 =
    createEnergyRing(
        3.4,
        0xff55bb,
        0.35
    );

const ring2 =
    createEnergyRing(
        3.55,
        0xff99dd,
        0.18
    );

const ring3 =
    createEnergyRing(
        3.8,
        0xaa55ff,
        0.1
    );


scene.add(
    ring1,
    ring2,
    ring3
);


// ============================================================
// ANIMATION
// ============================================================

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );

    const time =
        clock.getElapsedTime();


    // --------------------------------------------------------
    // MAIN 3D ROTATION
    // --------------------------------------------------------

    textParticles.rotation.y =
        time * 0.35;

    textParticles.rotation.x =
        Math.sin(time * 0.45)
        * 0.18;


    // --------------------------------------------------------
    // SPARKLES
    // --------------------------------------------------------

    sparkles.rotation.y =
        -time * 0.18;

    sparkles.rotation.x =
        Math.sin(time * 0.3)
        * 0.15;


    // --------------------------------------------------------
    // ENERGY RINGS
    // --------------------------------------------------------

    ring1.rotation.y =
        time * 0.35;

    ring2.rotation.y =
        -time * 0.25;

    ring3.rotation.y =
        time * 0.5;


    // --------------------------------------------------------
    // GLOW PULSE
    // --------------------------------------------------------

    const pulse =
        1 +
        Math.sin(time * 2.5)
        * 0.035;

    textParticles.scale.set(
        pulse,
        pulse,
        pulse
    );


    // --------------------------------------------------------
    // CAMERA
    // --------------------------------------------------------

    camera.position.x =
        Math.sin(time * 0.2)
        * 0.65;

    camera.position.y =
        Math.cos(time * 0.25)
        * 0.35;

    camera.lookAt(
        0,
        0,
        0
    );


    // --------------------------------------------------------
    // RENDER
    // --------------------------------------------------------

    renderer.render(
        scene,
        camera
    );
}


animate();


// ============================================================
// WINDOW RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
